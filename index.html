<!DOCTYPE html>
<html lang="en" data-theme="gameboy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f380f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitLog">
  <meta name="description" content="Your workout log, with quests, characters and XP.">
  <title>FitLog</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="hud" id="hud" hidden>
      <div class="avatar" id="hud-avatar" aria-hidden="true"></div>
      <div class="hud-info">
        <div class="hud-top"><span class="hud-name" id="hud-name"></span><span class="hud-level" id="hud-level"></span></div>
        <div class="xp-bar" id="xp-bar" role="progressbar" aria-label="Experience to next level" aria-valuemin="0" aria-valuemax="1000"><div class="xp-fill" id="xp-fill"></div></div>
        <div class="hud-sub"><span class="xp-text" id="xp-text"></span><span class="xp-text" id="hud-account"></span></div>
      </div>
    </div>
    <h1 id="app-title" hidden>FitLog</h1>
    <div class="tabs" id="tabs-top" role="tablist" aria-label="Training" hidden></div>
  </header>
  <main>
    <section id="panel-onboard" hidden></section>
    <noscript>FitLog needs JavaScript enabled to open your workout log.</noscript>
  </main>
  <nav class="tabs bottom" id="tabs-bottom" role="tablist" aria-label="Character and settings" hidden></nav>
  <datalist id="exercise-list"></datalist>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/config.js"></script>
  <script src="js/art.js"></script>
  <script src="js/classes.js"></script>
  <script src="js/state.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/account.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/log.js"></script>
  <script src="js/loot.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/history.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/gear.js"></script>
  <script src="js/bag.js"></script>
  <script src="js/store.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
